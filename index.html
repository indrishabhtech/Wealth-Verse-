<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WealthVerse</title>

<style>
body {
    margin:0;
    font-family: 'Segoe UI';
    background: #0f172a;
    color: white;
}

/* NAV */
.nav {
    position: fixed;
    bottom: 0;
    width: 100%;
    display: flex;
    justify-content: space-around;
    background: #020617;
    padding: 10px;
}

.nav button {
    background: none;
    border: none;
    color: #94a3b8;
    font-size: 16px;
}

.nav button.active {
    color: #38bdf8;
}

/* SCREEN */
.screen {
    display: none;
    padding: 20px;
    padding-bottom: 80px;
}

.activeScreen {
    display: block;
}

/* CARD */
.card {
    background: linear-gradient(145deg,#1e293b,#0f172a);
    padding: 15px;
    border-radius: 15px;
    margin-bottom: 15px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

/* MONEY */
.money {
    font-size: 28px;
    text-align:center;
    margin: 15px;
}

/* BUTTON */
.btn {
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: #38bdf8;
    color: white;
    margin: 5px;
}

/* ANIMATION */
.fade {
    animation: fade 0.4s;
}

@keyframes fade {
    from {opacity:0; transform: translateY(10px);}
    to {opacity:1; transform: translateY(0);}
}

/* THEME */
.light {
    background: #f1f5f9;
    color: black;
}
</style>

</head>
<body>

<h2 style="text-align:center;">💼 WealthVerse</h2>
<div class="money" id="money">₹0</div>

<!-- HOME -->
<div id="home" class="screen activeScreen fade">
    <div class="card">
        <h3>💰 Earn</h3>
        <button class="btn" onclick="earn()">Tap +₹100</button>
    </div>

    <div class="card">
        <h3>🏢 Business</h3>
        Income: ₹<span id="income">0</span>/sec<br>
        <button class="btn" onclick="buyBusiness()">Buy (₹5000)</button>
    </div>
</div>

<!-- STOCK -->
<div id="stocks" class="screen fade">
    <div class="card">
        <h3>📈 ITC</h3>
        Price: ₹<span id="itcPrice"></span><br>
        Owned: <span id="itcQty"></span><br>
        <button class="btn" onclick="buyStock()">Buy</button>
        <button class="btn" onclick="sellStock()">Sell</button>
    </div>

    <div class="card">
        <h3>📊 Market Status</h3>
        <span id="marketStatus">Loading...</span>
    </div>
</div>

<!-- SETTINGS -->
<div id="settings" class="screen fade">
    <div class="card">
        <h3>🎨 Theme</h3>
        <button class="btn" onclick="setTheme('dark')">Dark</button>
        <button class="btn" onclick="setTheme('light')">Light</button>
    </div>

    <div class="card">
        <h3>💾 Save</h3>
        <button class="btn" onclick="resetGame()">Reset Game</button>
    </div>
</div>

<!-- NAV -->
<div class="nav">
    <button onclick="switchScreen('home', this)" class="active">Home</button>
    <button onclick="switchScreen('stocks', this)">Stocks</button>
    <button onclick="switchScreen('settings', this)">Settings</button>
</div>

<script>

// GAME STATE
let game = {
    money: 1000,
    income: 0,
    itcPrice: 450,
    itcQty: 0,
    theme: 'dark'
};

// LOAD
let saved = localStorage.getItem("wealthverse");
if(saved) game = JSON.parse(saved);

// SAVE
function save(){
    localStorage.setItem("wealthverse", JSON.stringify(game));
}

// UI UPDATE
function updateUI(){
    document.getElementById("money").innerText = "₹" + game.money.toFixed(0);
    document.getElementById("income").innerText = game.income;
    document.getElementById("itcPrice").innerText = game.itcPrice.toFixed(2);
    document.getElementById("itcQty").innerText = game.itcQty;
}

// NAVIGATION
function switchScreen(id, btn){
    document.querySelectorAll(".screen").forEach(s=>s.classList.remove("activeScreen"));
    document.getElementById(id).classList.add("activeScreen");

    document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
}

// EARN
function earn(){
    game.money += 100;
    updateUI();
}

// BUSINESS
function buyBusiness(){
    if(game.money >= 5000){
        game.money -= 5000;
        game.income += 50;
    }
    updateUI();
}

// STOCK
function buyStock(){
    if(game.money >= game.itcPrice){
        game.money -= game.itcPrice;
        game.itcQty++;
    }
    updateUI();
}

function sellStock(){
    if(game.itcQty > 0){
        game.money += game.itcPrice;
        game.itcQty--;
    }
    updateUI();
}

// PASSIVE INCOME
setInterval(()=>{
    game.money += game.income;
    updateUI();
    save();
},1000);

// REAL STOCK API (OPTIONAL)
async function fetchStock(){
    try {
        let res = await fetch("https://api.twelvedata.com/price?symbol=ITC.NSE&apikey=demo");
        let data = await res.json();
        if(data.price){
            game.itcPrice = parseFloat(data.price);
            document.getElementById("marketStatus").innerText = "Live Data ✅";
        }
    } catch {
        document.getElementById("marketStatus").innerText = "Offline Mode ⚠️";
    }
}

// FALLBACK SIMULATION
setInterval(()=>{
    let change = (Math.random()-0.5)*3;
    game.itcPrice = Math.max(100, game.itcPrice + change);
    updateUI();
},3000);

// THEME
function setTheme(t){
    game.theme = t;
    if(t === 'light'){
        document.body.classList.add("light");
    } else {
        document.body.classList.remove("light");
    }
    save();
}

// RESET
function resetGame(){
    localStorage.clear();
    location.reload();
}

// INIT
updateUI();
fetchStock();
setInterval(fetchStock, 15000);

</script>

</body>
</html>
