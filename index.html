<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WealthVerse Pro</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#0f172a;
    color:white;
}

/* NAV */
.nav {
    position:fixed;
    bottom:0;
    width:100%;
    display:flex;
    justify-content:space-around;
    background:#020617;
    padding:10px;
}

.nav button {
    background:none;
    border:none;
    color:#94a3b8;
}

.nav button.active {
    color:#38bdf8;
}

/* SCREEN */
.screen { display:none; padding:15px; padding-bottom:80px;}
.active { display:block; }

/* CARD */
.card {
    background:linear-gradient(145deg,#1e293b,#020617);
    padding:15px;
    border-radius:15px;
    margin:10px 0;
}

/* BUTTON */
.btn {
    padding:8px;
    border:none;
    border-radius:8px;
    background:#38bdf8;
    color:white;
    margin:5px;
}

/* MONEY */
.money {
    text-align:center;
    font-size:26px;
    margin:10px;
}

/* THEMES */
.light { background:#f1f5f9; color:black;}
.neon { background:black; color:#00ffcc;}
</style>
</head>

<body>

<h2 style="text-align:center;">💼 WealthVerse Pro</h2>
<div class="money" id="money">₹0</div>

<!-- HOME -->
<div id="home" class="screen active">
<div class="card">
<button class="btn" onclick="earn()">Tap +₹100</button>
</div>

<div class="card">
Income: ₹<span id="income"></span>/sec<br>
<button class="btn" onclick="buyBusiness()">Buy Business</button>
</div>

<div class="card">
🏠 Real Estate<br>
Owned: <span id="houses"></span><br>
<button class="btn" onclick="buyHouse()">Buy House ₹20000</button>
</div>
</div>

<!-- STOCK -->
<div id="stocks" class="screen">

<div class="card">
<select id="stockSelect" onchange="updateChart()">
<option value="ITC.NSE">ITC</option>
<option value="RELIANCE.NSE">RELIANCE</option>
<option value="TCS.NSE">TCS</option>
</select>
</div>

<div class="card">
Price: ₹<span id="price"></span><br>
Owned: <span id="qty"></span><br>
<button class="btn" onclick="buyStock()">Buy</button>
<button class="btn" onclick="sellStock()">Sell</button>
</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

</div>

<!-- LEADERBOARD -->
<div id="leaderboard" class="screen">
<div class="card">
<h3>🏆 Top Rich</h3>
<div id="leaders"></div>
</div>
</div>

<!-- SETTINGS -->
<div id="settings" class="screen">
<div class="card">
<button class="btn" onclick="setTheme('dark')">Dark</button>
<button class="btn" onclick="setTheme('light')">Light</button>
<button class="btn" onclick="setTheme('neon')">Neon</button>
</div>
</div>

<!-- NAV -->
<div class="nav">
<button onclick="nav('home',this)" class="active">Home</button>
<button onclick="nav('stocks',this)">Stocks</button>
<button onclick="nav('leaderboard',this)">Rank</button>
<button onclick="nav('settings',this)">Settings</button>
</div>

<script>

// GAME STATE
let game = {
money:1000,
income:0,
houses:0,
stocks:{},
prices:{},
selected:"ITC.NSE"
};

// LOAD
let save = localStorage.getItem("wv");
if(save) game = JSON.parse(save);

// SAVE
function saveGame(){
localStorage.setItem("wv", JSON.stringify(game));
}

// NAV
function nav(id,btn){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");

document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
}

// UPDATE UI
function update(){
document.getElementById("money").innerText="₹"+game.money.toFixed(0);
document.getElementById("income").innerText=game.income;
document.getElementById("houses").innerText=game.houses;

let s = game.selected;
document.getElementById("price").innerText=game.prices[s]||0;
document.getElementById("qty").innerText=game.stocks[s]||0;
}

// EARN
function earn(){ game.money+=100; update(); }

// BUSINESS
function buyBusiness(){
if(game.money>=5000){
game.money-=5000;
game.income+=50;
}
update();
}

// REAL ESTATE
function buyHouse(){
if(game.money>=20000){
game.money-=20000;
game.houses++;
game.income+=200;
}
update();
}

// STOCK
function buyStock(){
let p = game.prices[game.selected]||0;
if(game.money>=p){
game.money-=p;
game.stocks[game.selected]=(game.stocks[game.selected]||0)+1;
}
update();
}

function sellStock(){
if((game.stocks[game.selected]||0)>0){
game.money+=game.prices[game.selected];
game.stocks[game.selected]--;
}
update();
}

// PASSIVE
setInterval(()=>{
game.money+=game.income;
update();
saveGame();
},1000);

// STOCK FETCH
async function fetchStock(symbol){
try{
let r = await fetch(`https://api.twelvedata.com/price?symbol=${symbol}&apikey=demo`);
let d = await r.json();
if(d.price){
game.prices[symbol]=parseFloat(d.price);
}
}catch{}
}

// MULTI STOCK UPDATE
setInterval(()=>{
["ITC.NSE","RELIANCE.NSE","TCS.NSE"].forEach(fetchStock);

// fallback
Object.keys(game.prices).forEach(k=>{
game.prices[k]+= (Math.random()-0.5)*2;
});

update();
},5000);

// CHART
let chart = new Chart(document.getElementById("chart"),{
type:"line",
data:{labels:[], datasets:[{label:"Price", data:[]}]}
});

function updateChart(){
game.selected = document.getElementById("stockSelect").value;
chart.data.labels.push("");
chart.data.datasets[0].data.push(game.prices[game.selected]||0);

if(chart.data.labels.length>20){
chart.data.labels.shift();
chart.data.datasets[0].data.shift();
}

chart.update();
update();
}

setInterval(updateChart,2000);

// LEADERBOARD
let leaders = [
{name:"Elon",money:300000000000},
{name:"Mukesh",money:90000000000},
{name:"Rishabh",money:()=>game.money}
];

function updateLeaders(){
let html="";
leaders.forEach(l=>{
let val = typeof l.money==="function"?l.money():l.money;
html+=`${l.name} - ₹${val.toFixed(0)}<br>`;
});
document.getElementById("leaders").innerHTML=html;
}
setInterval(updateLeaders,2000);

// THEME
function setTheme(t){
document.body.className="";
if(t!=="dark") document.body.classList.add(t);
}

// INIT
update();

</script>

</body>
</html>
